[project]
name = "tibiabot"
version = "0.1.0"
description = "Tibia Discord bot: deaths, levels, online lists, loot split, boss predictions, respawn web board"
requires-python = ">=3.12"
dependencies = [
  "discord.py>=2.5",
  "asyncpg>=0.30",
  "aiohttp>=3.10",
  "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
]

[project.scripts]
tibiabot = "tibiabot.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tibiabot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
